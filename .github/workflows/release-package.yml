name: Release Package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned release CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install HauntedMC/gh-haunted-release --pin 5165e777de588ab722af44b43b87c26d2baaafb9
      - id: version
        name: Detect a reviewed version change
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: gh haunted-release gate

  publish:
    needs: gate
    permissions:
      contents: write
      packages: write
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PLATFORM_ACCEPTANCE_KEEP_WORK_DIRECTORY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned release CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install HauntedMC/gh-haunted-release --pin 5165e777de588ab722af44b43b87c26d2baaafb9
      - name: Set up JDK 25 and Maven package credentials
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - name: Require package credentials
        run: |
          if [[ -z "$PACKAGES_USER" || -z "$PACKAGES_TOKEN" ]]; then
            echo 'HAUNTEDMC_PACKAGES_USERNAME and HAUNTEDMC_PACKAGES_TOKEN are required.' >&2
            exit 1
          fi
      - id: preflight
        name: Inspect already published Maven coordinates
        run: gh haunted-release published-state "${{ needs.gate.outputs.version }}"
      - name: Verify and publish with backend and platform acceptance
        env:
          DEPLOY_GOAL: ${{ steps.preflight.outputs.state == 'complete' && 'verify' || 'deploy' }}
          PLATFORM_ACCEPTANCE_WORK_DIRECTORY: ${{ runner.temp }}/dataprovider-platform-acceptance
        run: ./mvnw -U -B -ntp -DdeployAtEnd=true -Pintegration-tests,platform-acceptance "$DEPLOY_GOAL"
      - name: Resolve every published artifact from a fresh Maven repository
        run: gh haunted-release verify-published "${{ needs.gate.outputs.version }}"
      - name: Create the release tag only after publication is resolvable
        run: gh release create "${{ needs.gate.outputs.tag }}" --target "$GITHUB_SHA" --title "DataProvider ${{ needs.gate.outputs.tag }}" --generate-notes dataprovider-platform-paper/target/dataprovider-platform-paper-${{ needs.gate.outputs.version }}-bundled.jar dataprovider-platform-velocity/target/dataprovider-platform-velocity-${{ needs.gate.outputs.version }}-bundled.jar
      - name: Create cross-repository GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.HAUNTEDMC_RELEASE_APP_ID }}
          private-key: ${{ secrets.HAUNTEDMC_RELEASE_APP_PRIVATE_KEY }}
          owner: HauntedMC
      - name: Queue reviewed downstream update PRs
        env:
          DISPATCH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/HauntedMC/HauntedPlatform/dispatches \
            --method POST --input - <<EOF
          {"event_type":"internal-release","client_payload":{"producer":"DataProvider","version":"$RELEASE_VERSION"}}
          EOF
