name: Release Package

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Validate release version
        id: release-version
        run: |
          PROJECT_VERSION="$(./mvnw -q -ntp -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PROJECT_VERSION" = "$TAG_VERSION" || { echo "Tag version does not match Maven project version." >&2; exit 1; }
          echo "value=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify and publish the exact release reactor
        # deployAtEnd prevents publication until the final runtime fixture has booted the packaged Paper and Velocity bundles.
        run: ./mvnw -U -B -ntp -Pintegration-tests,platform-acceptance deploy
        env:
          PLATFORM_ACCEPTANCE_WORK_DIRECTORY: ${{ runner.temp }}/dataprovider-platform-acceptance
          PLATFORM_ACCEPTANCE_KEEP_WORK_DIRECTORY: "true"

      - name: Upload failing platform acceptance logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-acceptance-logs
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dataprovider-platform-acceptance/paper/logs/latest.log
            ${{ runner.temp }}/dataprovider-platform-acceptance/backend.log
            ${{ runner.temp }}/dataprovider-platform-acceptance/velocity/logs/latest.log

      - name: Upload platform distributables
        uses: actions/upload-artifact@v7
        with:
          name: dataprovider-platform-jars
          if-no-files-found: error
          path: |
            dataprovider-platform-paper/target/dataprovider-platform-paper-${{ steps.release-version.outputs.value }}-bundled.jar
            dataprovider-platform-velocity/target/dataprovider-platform-velocity-${{ steps.release-version.outputs.value }}-bundled.jar

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: DataProvider ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dataprovider-platform-paper/target/dataprovider-platform-paper-${{ steps.release-version.outputs.value }}-bundled.jar
            dataprovider-platform-velocity/target/dataprovider-platform-velocity-${{ steps.release-version.outputs.value }}-bundled.jar
