name: Apply resilience test synchronization fix

on:
  push:
    branches:
      - fix/resilience-reload-test-race
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/resilience-reload-test-race
          fetch-depth: 0

      - name: Apply deterministic test synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dataprovider-core/src/test/java/nl/hauntedmc/dataprovider/core/DataProviderRegistryTest.java")
          text = path.read_text(encoding="utf-8")
          old = """        registry.reloadConfiguration();
          int probesBeforeOldClose = sharedTarget.probeCalls;
"""
          new = """        registry.reloadConfiguration();
          // reloadConfiguration intentionally requests health asynchronously. Drain that request
          // before taking the baseline so the post-close verification cannot reuse the same future.
          registry.probeRemoteHealthAsync().join();
          int probesBeforeOldClose = sharedTarget.probeCalls;
"""
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one resilience test synchronization point")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm .github/workflows/apply-resilience-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize resilience reload race test"
          git push origin HEAD:fix/resilience-reload-test-race
