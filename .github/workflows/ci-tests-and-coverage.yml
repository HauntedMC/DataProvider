name: CI Tests and Coverage

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Discard cached Paper API
        run: rm -rf "$HOME/.m2/repository/io/papermc/paper/paper-api"

      - name: Run Unit and Backend Integration Tests
        id: tests
        run: ./mvnw -U -B -ntp -Pintegration-tests verify

      - name: Print failing test reports
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          find . -type f \( -path '*/target/surefire-reports/*.txt' -o -path '*/target/failsafe-reports/*.txt' \) -print0 \
            | sort -z \
            | xargs -0 -r -n1 sh -c 'echo "::group::$0"; cat "$0"; echo "::endgroup::"'

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          if-no-files-found: warn
          path: "**/target/site/jacoco"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          if-no-files-found: warn
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
            target/ci

  platform-acceptance:
    name: Bundled Platform Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN

      - name: Discard cached Paper API
        run: rm -rf "$HOME/.m2/repository/io/papermc/paper/paper-api"

      - name: Run bundled platform acceptance
        run: ./mvnw -U -B -ntp -Pplatform-acceptance verify
        env:
          PLATFORM_ACCEPTANCE_WORK_DIRECTORY: ${{ runner.temp }}/dataprovider-platform-acceptance
          PLATFORM_ACCEPTANCE_KEEP_WORK_DIRECTORY: "true"

      - name: Upload platform acceptance logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-acceptance-logs
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dataprovider-platform-acceptance/paper/logs/latest.log
            ${{ runner.temp }}/dataprovider-platform-acceptance/backend.log
            ${{ runner.temp }}/dataprovider-platform-acceptance/velocity/logs/latest.log
