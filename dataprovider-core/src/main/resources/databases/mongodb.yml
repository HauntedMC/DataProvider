default:
  # Set this to the exact Paper plugin name or Velocity plugin id allowed to use this connection.
  # No plugin can use this connection until it has been configured.
  access:
    owner_plugin: ""
    shared_with: []
  host: localhost
  port: 27017
  database: minecraft
  username: ""
  password: ""
  authSource: minecraft
  require_secure_transport: false
  tls:
    enabled: false
    allow_invalid_hostnames: false
    trust_all_certificates: false
    trust_store_path: ""
    trust_store_password: ""
    trust_store_type: ""
  max_connection_pool_size: 16
  min_connection_pool_size: 0
  connect_timeout_ms: 5000
  socket_timeout_ms: 5000
  server_selection_timeout_ms: 5000
