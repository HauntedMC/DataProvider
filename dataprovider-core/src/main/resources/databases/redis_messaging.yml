default:
  # Set this to the exact Paper plugin name or Velocity plugin id allowed to use this connection.
  # No plugin can use this connection until it has been configured.
  access:
    owner_plugin: ""
    shared_with: []
  host: "localhost"
  port: 6379
  user: "plugin"
  password: ""
  database: 0
  require_secure_transport: false
  tls:
    enabled: false
    verify_hostname: true
    trust_all_certificates: false
    trust_store_path: ""
    trust_store_password: ""
    trust_store_type: ""
  pool:
    connections: 8
    min_idle: 2
    max_idle: 8
    test_on_borrow: true
    test_while_idle: true
    max_subscriptions: 64
    handler_batch_size: 64
  reconnect:
    initial_backoff_ms: 250
    max_backoff_ms: 10000
    jitter: 0.20
    # Zero keeps retrying until the subscription is explicitly closed or the scope shuts down.
    max_attempts: 0
  connection_timeout_ms: 2000
  socket_timeout_ms: 2000
  security:
    max_payload_chars: 32768
    max_queued_messages_per_handler: 1024
