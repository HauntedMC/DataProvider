default:
  # Set this to the exact Paper plugin name or Velocity plugin id allowed to use this connection.
  # No plugin can use this connection until it has been configured.
  access:
    owner_plugin: ""
    shared_with: []
  host: "localhost"
  port: 6379
  user: "plugin"
  password: ""
  database: 0
  require_secure_transport: false
  tls:
    enabled: false
    verify_hostname: true
    trust_all_certificates: false
    trust_store_path: ""
    trust_store_password: ""
    trust_store_type: ""
  pool:
    connections: 8
    min_idle: 2
    max_idle: 8
    test_on_borrow: true
    test_while_idle: true
    max_subscriptions: 64
    handler_batch_size: 64
  reconnect:
    initial_backoff_ms: 250
    max_backoff_ms: 10000
    jitter: 0.20
    # Zero keeps retrying until the subscription is explicitly closed or the scope shuts down.
    max_attempts: 0
  # Redis Streams-backed, acknowledged delivery for votes, purchases, punishments and authoritative state.
  # Pub/Sub above remains only for disposable notifications.
  durable:
    batch_size: 32
    # Keep this below socket_timeout_ms; leave time for the Redis response to traverse the network.
    read_block_ms: 500
    # Set this higher than the longest normal business transaction. A live slow handler can otherwise be reclaimed.
    reclaim_idle_ms: 30000
    max_attempts: 8
    # Retention is trimmed only before every group's pending and undelivered positions.
    retention_ms: 604800000
    retention_max_entries: 1000000
    retention_trim_interval_ms: 30000
    # Must cover the maximum interval in which a producer may retry an uncertain publish result.
    deduplication_ttl_seconds: 604800
    dead_letter_max_entries: 100000
  connection_timeout_ms: 2000
  socket_timeout_ms: 2000
  security:
    max_payload_chars: 32768
    max_queued_messages_per_handler: 1024
