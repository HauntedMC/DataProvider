services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: minecraft
      MYSQL_ROOT_PASSWORD: acceptance-root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pacceptance-root --silent"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:7.0
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "acceptance-redis"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a acceptance-redis ping | grep PONG"]
      interval: 2s
      timeout: 5s
      retries: 30
